name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and tests
    # Linux is the deployment target, and a large part of the suite asserts
    # Linux descriptor-relative path anchoring that cannot run on macOS, so
    # this is the only platform where a green run means anything.
    # Keep fork PR code on GitHub-hosted machines.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the `packageManager` field, and must run
      # before setup-node so the pnpm store cache can be resolved.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Both commands are exactly what a contributor runs locally. A type error
      # here is a merge blocker, not a baseline to carry forward: the `pass`/
      # `fail` verdict regression that reached master on 2026-09-18 was a real
      # behavioral bug that tsc had been reporting for three hours.
      - name: Typecheck
        run: pnpm run check

      - name: Tests
        run: pnpm run test:run

  package-smoke:
    name: Built package smoke
    # Same Linux gate as the test job. This one checks the tarball users
    # install: build, pack, entrypoints, and the mocked golden path.
    # Keep fork PR code on GitHub-hosted machines.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm pack` runs prepack, which builds again. This step is the explicit
      # build gate; the smoke then packs that publish path and installs it.
      - name: Build
        run: pnpm run build

      - name: Pack, install, and smoke
        run: pnpm run package:smoke

      # Command logs and proof flags only. The smoke deletes the fixture
      # repository and run evidence before this upload.
      - name: Upload package smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: package-smoke-diagnostics
          path: package-smoke-diagnostics/
          if-no-files-found: warn
          retention-days: 7
